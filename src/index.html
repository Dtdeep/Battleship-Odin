<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Welcome to Battleship Game!</h1>
    <div class="game-environment">
      <div id="boards-container">
        <h1>Computer Game Board</h1>
        <h1>Player Game Board</h1>
        <div id="board-1"></div>
        <div id="board-2"></div>
      </div>
      <div class="ships">
        <h2 id="Carrier" draggable="true" data-ship-type="Carrier">
          Carrier (5 tiles)
        </h2>
        <h2 id="Battleship" draggable="true" data-ship-type="Battleship">
          Battleship (4 tiles)
        </h2>
        <h2 id="Destroyer" draggable="true" data-ship-type="Destroyer">
          Destroyer (3 tiles)
        </h2>
        <h2 id="Submarine" draggable="true" data-ship-type="Submarine">
          Submarine (3 tiles)
        </h2>
        <h2 id="Patrol" draggable="true" data-ship-type="Patrol Boat">
          Patrol Boat (2 tiles)
        </h2>
      </div>
    </div>
  </body>
</html>
